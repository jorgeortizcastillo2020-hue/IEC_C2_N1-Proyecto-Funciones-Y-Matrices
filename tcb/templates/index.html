<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El TCB · Robustecedor de contraseñas</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:3rem auto;padding:0 1rem;color:#1d2433}
  h1{font-size:1.4rem;margin-bottom:.2rem} p.sub{color:#5b6475;margin-top:0}
  label{display:block;margin:1.2rem 0 .3rem;font-weight:600}
  input{width:100%;box-sizing:border-box;padding:.65rem;font:1rem ui-monospace,monospace;border:1px solid #b9c0cd;border-radius:6px}
  input[readonly]{background:#f1f4f9}
  button{margin-top:1rem;padding:.65rem 1.2rem;font-size:1rem;border:0;border-radius:6px;background:#1f4fd8;color:#fff;cursor:pointer}
  #error{color:#b3261e;margin-top:.8rem;min-height:1.2rem}
  small{color:#5b6475;display:block;margin-top:2rem}
</style>
</head>
<body>
<h1>El TCB</h1>
<p class="sub">Robustecedor de contraseñas · uso local del administrador de TI</p>

<label for="entrada">Contraseña original</label>
<input id="entrada" type="text" maxlength="64" autocomplete="off" spellcheck="false">

<button id="btn">Transformar</button>
<div id="error" role="alert"></div>

<label for="salida">Contraseña robustecida</label>
<input id="salida" type="text" readonly>

<small>La contraseña no se almacena: se procesa en memoria y se descarta.</small>

<script>
const $ = id => document.getElementById(id);
$("btn").addEventListener("click", async () => {
  $("error").textContent = ""; $("salida").value = "";
  try {
    const r = await fetch("/transformar", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password: $("entrada").value})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Error");
    $("salida").value = d.resultado;
  } catch (e) { $("error").textContent = e.message; }
});
</script>
</body>
</html>
